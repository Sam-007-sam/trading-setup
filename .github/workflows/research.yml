name: Research

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run intraday rule research
        run: python research.py
      - name: Commit results
        run: |
          git config user.name "premarket-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/research.json research/RESULTS.md
          git diff --cached --quiet && exit 0
          git commit -m "Research results $(TZ=Asia/Kolkata date +%F)"
          git pull --rebase -q && git push
